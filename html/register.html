<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>註冊｜跑腿平台</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">
  <main class="card auth-card">
    <a class="brand auth-brand" href="index.html">🛵 跑腿平台</a>
    <h1 class="auth-title">註冊</h1>
    <form id="register-form" novalidate>
      <div class="form-group">
        <label for="email">Email <span class="required">*</span></label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
        <div class="field-error" data-err></div>
      </div>
      <div class="form-group">
        <label for="password">密碼 <span class="required">*</span></label>
        <input type="password" id="password" placeholder="最少 8 位，包含英文字母同數字" autocomplete="new-password">
        <div class="field-error" data-err></div>
      </div>
      <div class="form-group">
        <label for="confirm">確認密碼 <span class="required">*</span></label>
        <input type="password" id="confirm" placeholder="再打一次密碼" autocomplete="new-password">
        <div class="field-error" data-err></div>
      </div>
      <div class="form-group">
        <label for="name">姓名 <span class="required">*</span></label>
        <input type="text" id="name" maxlength="20" placeholder="2–20 個字">
        <div class="field-error" data-err></div>
      </div>
      <div class="form-group">
        <label for="phone">電話 <span class="required">*</span></label>
        <input type="tel" id="phone" maxlength="8" placeholder="91234567">
        <div class="field-error" data-err></div>
      </div>
      <div class="form-error" id="form-error" hidden></div>
      <button type="submit" class="btn btn-primary btn-block" id="btn-submit">註冊</button>
    </form>
    <p class="auth-switch">已經有帳戶？<a href="login.html">登入</a></p>
  </main>
  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
